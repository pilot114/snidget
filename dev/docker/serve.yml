services:
  nginx:
    image: nginx:1.27
    ports:
      - "${PORT}:80"
    volumes:
      - "./nginx/site.conf:/etc/nginx/conf.d/default.conf"
      - "../../public:/app/public:ro"
      - "../docs:/app/docs:ro"
    command: ['nginx', '-g', 'daemon off;']
  php:
    build:
      context: php
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    working_dir: /app
    environment:
      PHP_IDE_CONFIG: "serverName=Docker"
    volumes:
      - "../../:/app"
#      - "../../data:/app/data"
#      - "../../vendor:/app/vendor"
#      - "../../tests/coverage:/app/dev/tests/coverage"
      - "${HOME}/.ssh:/home/workspace/.ssh"
      - "${HOME}/.gitconfig:/home/workspace/.gitconfig"
